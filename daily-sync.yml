name: Daily sync

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 India time, every day
  workflow_dispatch:        # "Run workflow" button for a manual test

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's feed
        run: python3 scripts/update_feed.py feed.json

      - name: Commit if changed
        run: |
          git config user.name "preptrack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          if git diff --cached --quiet; then
            echo "No changes to feed.json"
          else
            git commit -m "Daily sync: $(date -u +%F)"
            git push
          fi
